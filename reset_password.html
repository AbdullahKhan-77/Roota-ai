<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roota — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' stroke='%233B82F6' stroke-width='2.5' fill='%23090909'/%3E%3Ccircle cx='10' cy='16' r='2.5' fill='%233B82F6'/%3E%3Cpath d='M15 11.5L21.5 16L15 20.5' stroke='%233B82F6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #09090B;
            --surface: #0F1117;
            --border: #27272A;
            --blue: #3B82F6;
            --text: #F9FAFB;
            --muted: #9CA3AF;
            --green: #22c55e;
        }

        html, body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 17, 23, 0.85);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.05);
        }

        .card-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-heading h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .card-heading p {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .form-group { margin-bottom: 16px; }

        .form-label {
            font-size: 0.8rem;
            margin-bottom: 7px;
            color: var(--muted);
        }

        .input-wrap { position: relative; }

        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.875rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        input:focus { outline: none; border-color: var(--blue); }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--blue);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
        }

        .submit-btn:hover { background: #2563eb; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-top: 12px;
            display: none;
        }

        .success-msg {
            background: rgba(34, 197, 94, 0.1);
            color: var(--green);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-top: 12px;
            display: none;
        }

        .back-to-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--blue);
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="auth-card">
            <div class="card-heading">
                <h1>Set a new password</h1>
                <p id="subtitle">Enter and confirm your new password below.</p>
            </div>

            <div id="resetForm">
                <div class="form-group">
                    <div class="form-label">New Password</div>
                    <div class="input-wrap">
                        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label">Confirm Password</div>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
                    </div>
                </div>
                <button class="submit-btn" id="resetBtn" onclick="submitReset()">Reset Password →</button>
                <div class="error-msg" id="errorMsg"></div>
                <div class="success-msg" id="successMsg"></div>
            </div>

            <a href="/login" class="back-to-login">← Back to sign in</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('subtitle').textContent = 'This reset link is invalid. Please request a new one from the login page.';
        }

        async function submitReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('errorMsg');
            const successEl = document.getElementById('successMsg');
            const btn = document.getElementById('resetBtn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!newPassword || !confirmPassword) {
                errorEl.textContent = 'Please fill in both fields.';
                errorEl.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const formData = new FormData();
                formData.append('token', token);
                formData.append('new_password', newPassword);

                const response = await fetch('/reset-password', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    errorEl.textContent = data.detail || 'Something went wrong.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Reset Password →';
                    return;
                }

                successEl.textContent = 'Password reset successfully. Redirecting to login...';
                successEl.style.display = 'block';
                document.getElementById('resetForm').querySelectorAll('input, button').forEach(el => el.disabled = true);

                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } catch (e) {
                errorEl.textContent = 'Could not connect to server.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Reset Password →';
            }
        }
    </script>
</body>
</html>
