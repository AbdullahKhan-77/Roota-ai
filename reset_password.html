<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roota — Reset Password</title>
  <meta name="theme-color" content="#0a0c0b">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%230e1110' stroke='%2334e28a' stroke-width='2'/%3E%3Ccircle cx='10' cy='16' r='2.6' fill='%237defb6'/%3E%3Cpath d='M14.5 11.5L21 16l-6.5 4.5' stroke='%2334e28a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/roota.css">
  <style>
    .page { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
    .auth-card { width: 100%; max-width: 420px; background: rgba(18,22,21,0.7); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 34px; backdrop-filter: blur(20px); box-shadow: var(--shadow); }
    .card-logo { display: flex; justify-content: center; margin-bottom: 18px; }
    .card-heading { text-align: center; margin-bottom: 24px; }
    .card-heading h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .card-heading p { font-size: 0.9rem; color: var(--muted); }
    .error-msg { background: rgba(255,100,89,0.1); border: 1px solid rgba(255,100,89,0.3); color: #ffb3ba; padding: 10px 13px; border-radius: var(--r-sm); font-size: 0.82rem; margin-top: 12px; display: none; }
    .success-msg { background: rgba(52,226,138,0.1); border: 1px solid rgba(52,226,138,0.3); color: var(--ok); padding: 10px 13px; border-radius: var(--r-sm); font-size: 0.82rem; margin-top: 12px; display: none; }
    .back-to-login { display: block; text-align: center; margin-top: 20px; color: var(--iris-2); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="aurora a1"></div><div class="aurora a2"></div></div>
  <div class="page">
    <div class="auth-card">
      <div class="card-logo">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#0e1110" stroke="#34e28a" stroke-width="2"/><circle cx="10" cy="16" r="2.6" fill="#7defb6"/><path d="M14.5 11.5L21 16l-6.5 4.5" stroke="#34e28a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="card-heading">
        <h1>Set a new password</h1>
        <p id="subtitle">Enter and confirm your new password below.</p>
      </div>

      <div id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input class="input" type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input class="input" type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" id="resetBtn" onclick="submitReset()">Reset password <span class="arw">→</span></button>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
      </div>

      <a href="/login" class="back-to-login">← Back to sign in</a>
    </div>
  </div>

  <script src="/assets/roota.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('subtitle').textContent = 'This reset link is invalid. Please request a new one from the login page.';
    }

    async function submitReset() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('errorMsg');
      const successEl = document.getElementById('successMsg');
      const btn = document.getElementById('resetBtn');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      if (!newPassword || !confirmPassword) { errorEl.textContent = 'Please fill in both fields.'; errorEl.style.display = 'block'; return; }
      if (newPassword !== confirmPassword) { errorEl.textContent = 'Passwords do not match.'; errorEl.style.display = 'block'; return; }
      if (newPassword.length < 6) { errorEl.textContent = 'Password must be at least 6 characters.'; errorEl.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Resetting...';
      try {
        const formData = new FormData();
        formData.append('token', token);
        formData.append('new_password', newPassword);
        const response = await fetch('/reset-password', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) {
          errorEl.textContent = data.detail || 'Something went wrong.';
          errorEl.style.display = 'block';
          btn.disabled = false; btn.innerHTML = 'Reset password <span class="arw">→</span>';
          return;
        }
        successEl.textContent = 'Password reset successfully. Redirecting to login...';
        successEl.style.display = 'block';
        document.getElementById('resetForm').querySelectorAll('input, button').forEach(el => el.disabled = true);
        setTimeout(() => { window.location.href = '/login'; }, 2000);
      } catch (e) {
        errorEl.textContent = 'Could not connect to server.';
        errorEl.style.display = 'block';
        btn.disabled = false; btn.innerHTML = 'Reset password <span class="arw">→</span>';
      }
    }
    document.addEventListener('keypress', (e) => { if (e.key === 'Enter' && token) submitReset(); });
  </script>
</body>
</html>
